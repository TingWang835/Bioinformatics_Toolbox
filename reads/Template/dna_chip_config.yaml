# ~~~~~ CHIPseq Template~~~~~

# =============================================================================
# General Variables
# =============================================================================

#PRJN number (only used in getdata_sra)
PRJNUMBER: "PRJNA306490"

# Project name 
PRJNAME: "chip_cst6p_2016"


# =============================================================================
# Ref variables 
# =============================================================================

REF: 
  SOURCE: "ensembl"
  SPECIES: "saccharomyces_cerevisiae"
  ASSEMBLY: "R64-1-1" # e.g. ncbi: GRCh38, ensembl: R64-2-1
  RELEASE: "83" # ncbi: p14 (patch #), ensemble: 83
  ACC: "" # leave empty for ensembl

# =============================================================================
# getdata.smk specific variables
# =============================================================================
# choose Data source for LOCAL or SRA 
#LOCAL: create a runinfo.csv from items under reads/{PRJNAME}
#SRA: if runinfo.csv exist: download SRRs from runinfo.csv, else query for runinfo.csv from SRA metadata
DSOURCE: "SRA"


# Control and treatment condiction in study design
CONTROL_COND: "glucose" 
TREAT_COND: "ethanol"

# =============================================================================
# qc.smk specific variabble
# =============================================================================
# trim quality below a certain level
QUALITY: "30"

# Minimum length to keep
LENGTH: "20"


# =============================================================================
# chip_aligner.smk specific variable
# =============================================================================
# choose alinger f(bwa, bowtie2, minimap2_sr (use lower case!!))
DNA_ALIGNER: "bowtie2"


# choose Mapping Quality score for filter bam
MAPQ: "30"

# choose to remove duplicates or flag them by Picard Markduplicates (later handle by peak caller)
# default: false
RM_DUP: "false"


# =============================================================================
# chip_peakcall.smk specific variable
# =============================================================================
PEAKCALL:
  CALLER: "gem"         # available caller: macs3, gem (macs2 failed to work on Linux mint OS due to "__log_finite" error)
  FORMAT: "BAM"           # macs3/GEM var: BAM, BAMPE; GEM: BAM, BED, SAM
  EXTSIZE: 20             # macs3 var: default 0, set to ignore protein footprint (in bp) before reaching motif
  G_SIZE: 12100000        # macs3 var: hs, ce, mm, dm or integer of genome size; leave blank/null for GEM
  FDR: 0.01               # macs3 var, leave blank/null for GEM
  # PVAL: 1e-7              # macs3 var, leave blank/null for GEM
  MODEL: "nomodel"        # macs3 var: shift, extsize, nomodel, leave blank for GEM
  SMOOTHING: 30           # GEM var: read spatial smoothing window (default is 30), null for macs3
  GEM_VERSION: "v2.5"     # GEM var: version for (default v2.5) gem.jar, read distribution default(Chip) and Chip-exo (leave blank for macs3
  K_MIN: 6
  K_MAX: 13
  READ_DIST: "ChIP-exo.txt" # GEM var: default.tst, ChIP-exo.txt determine which read distribution,leave blank for Macs3

## MEME-Chip variables
CCUT: 200     #cut off peak sequence <X bp, sequence was unified at +-100bp around 

# =============================================================================
# chip_annotation.smk specific variable
# =============================================================================

# setting TSS region for ChipSeeker (bp)
TSS_REGION_START: -3000
TSS_REGION_END: 100

# determine boundary for profile plot (bp)
INTENSITY_UP: 3000
INTENSITY_down: 1000

# GO and KEGG enrichment variables
KEGG_ORG: "sce"     # Short code for KEGG (e.g., "hsa", "mmu", "sce")
ENRICH_PVAL: 0.05   # p value cutoff for enrichments
ENRICH_QVAL: 0.2   # FDR cutoff for enrichments

# plot variables
BG_COLOR: "white" # set back ground color for dotplot
DOTPLOT_HEIGHT: 10 # dotplot height (increase to avoid clustering)
